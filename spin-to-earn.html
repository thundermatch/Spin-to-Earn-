<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐱 Kitty Spin & Earn</title>
<script src='//libtl.com/sdk.js' data-zone='10491425' data-sdk='show_10491425'></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');

  :root {
    --bg: #0f0c1a;
    --card: #1a1530;
    --card2: #221e3a;
    --accent1: #ff6bbd;
    --accent2: #ffcf40;
    --accent3: #7de8e0;
    --accent4: #a78bfa;
    --accent5: #ff8c5a;
    --glow1: rgba(255, 107, 189, 0.45);
    --glow2: rgba(255, 207, 64, 0.35);
    --glow3: rgba(125, 232, 224, 0.3);
    --text: #f0eaff;
    --text2: #b8aedd;
    --border: rgba(167, 139, 250, 0.2);
    --wheel-bg: #1e1836;
    --seg0: #ff6bbd;
    --seg1: #7de8e0;
    --seg2: #ffcf40;
    --seg3: #a78bfa;
    --seg4: #ff8c5a;
    --seg5: #6de88a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    overflow: hidden;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    position: relative;
  }

  /* Animated background */
  .bg-stars {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle linear infinite;
    opacity: 0;
  }

  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 0.8; transform: scale(1); }
  }

  .bg-blob {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(80px); opacity: 0.12;
  }
  .blob1 { width: 300px; height: 300px; background: var(--accent1); top: -80px; left: -80px; }
  .blob2 { width: 250px; height: 250px; background: var(--accent4); bottom: 60px; right: -60px; }
  .blob3 { width: 200px; height: 200px; background: var(--accent2); top: 40%; left: 30%; }

  /* App container */
  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 0 16px 20px;
    gap: 0;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 4px 10px;
  }

  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
    filter: drop-shadow(0 2px 8px var(--glow1));
  }

  .streak-badge {
    display: flex; align-items: center; gap: 5px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.78rem; font-weight: 700;
    color: var(--accent2);
  }

  /* Points card */
  .points-card {
    width: 100%;
    background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; overflow: hidden;
    box-shadow: 0 4px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
    margin-bottom: 12px;
  }
  .points-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,107,189,0.07) 0%, rgba(125,232,224,0.05) 100%);
    pointer-events: none;
  }

  .points-label {
    font-size: 0.72rem; font-weight: 700; color: var(--text2);
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2px;
  }
  .points-value {
    font-family: 'Fredoka One', cursive;
    font-size: 2.6rem; line-height: 1;
    background: linear-gradient(135deg, var(--accent2), var(--accent5));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(255,207,64,0.4));
    transition: transform 0.2s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  .points-value.bump {
    animation: pointsBump 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes pointsBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .points-icon {
    font-size: 2.6rem; filter: drop-shadow(0 0 12px rgba(255,207,64,0.5));
    animation: iconFloat 3s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* Wheel area */
  .wheel-container {
    position: relative;
    width: 100%;
    display: flex; flex-direction: column;
    align-items: center;
    margin-bottom: 12px;
  }

  .wheel-wrap {
    position: relative;
    width: min(330px, 88vw);
    height: min(330px, 88vw);
    display: flex; align-items: center; justify-content: center;
  }

  /* Glow ring */
  .wheel-glow {
    position: absolute; inset: -10px;
    border-radius: 50%;
    background: conic-gradient(
      var(--seg0), var(--seg1), var(--seg2),
      var(--seg3), var(--seg4), var(--seg5), var(--seg0)
    );
    filter: blur(20px);
    opacity: 0.35;
    animation: glowPulse 2.5s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes glowPulse {
    0%,100% { opacity: 0.25; transform: scale(0.98); }
    50% { opacity: 0.45; transform: scale(1.02); }
  }

  /* Outer ring */
  .wheel-outer-ring {
    position: absolute; inset: -6px; border-radius: 50%;
    background: linear-gradient(135deg, #2e2850, #1a1535);
    border: 3px solid rgba(255,255,255,0.08);
    box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.06);
    z-index: 1;
  }

  /* Wheel canvas */
  #wheelCanvas {
    position: relative; z-index: 2;
    border-radius: 50%;
    cursor: pointer;
    transition: filter 0.3s;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    display: block;
  }
  #wheelCanvas:active { filter: brightness(0.9); }
  #wheelCanvas.spinning { cursor: not-allowed; }

  /* Center hub */
  .wheel-center {
    position: absolute; z-index: 10;
    width: 72px; height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2e2a50, #0f0c1a);
    border: 3px solid rgba(255,255,255,0.12);
    box-shadow: 0 0 0 4px rgba(167,139,250,0.2), 0 8px 24px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .wheel-center:active { transform: scale(0.92); }

  .cat-img {
    width: 56px; height: 56px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    animation: catBob 3s ease-in-out infinite;
  }
  @keyframes catBob {
    0%,100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-3px) rotate(-3deg); }
    75% { transform: translateY(-2px) rotate(3deg); }
  }

  /* Pointer */
  .wheel-pointer {
    position: absolute; top: -18px; z-index: 15;
    width: 28px; height: 40px;
    display: flex; flex-direction: column; align-items: center;
  }
  .pointer-body {
    width: 22px; height: 34px;
    background: linear-gradient(160deg, var(--accent1), #c0458f);
    clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
    filter: drop-shadow(0 4px 12px var(--glow1));
    animation: pointerWiggle 2s ease-in-out infinite;
  }
  @keyframes pointerWiggle {
    0%,100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  /* Spin button */
  .spin-btn {
    margin-top: 14px;
    width: min(280px, 80vw);
    padding: 16px 32px;
    border: none; outline: none;
    border-radius: 50px;
    background: linear-gradient(135deg, var(--accent1) 0%, var(--accent5) 100%);
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    letter-spacing: 1px;
    cursor: pointer;
    position: relative; overflow: hidden;
    box-shadow: 0 6px 30px rgba(255,107,189,0.45), 0 2px 8px rgba(0,0,0,0.3);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .spin-btn::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: btnShine 3s ease-in-out infinite;
  }
  @keyframes btnShine {
    0% { left: -100%; }
    60%,100% { left: 160%; }
  }
  .spin-btn:not(:disabled):active {
    transform: scale(0.95) translateY(2px);
    box-shadow: 0 3px 15px rgba(255,107,189,0.3);
  }
  .spin-btn:disabled {
    opacity: 0.6; cursor: not-allowed;
    animation: none;
  }
  .spin-btn:disabled::before { display: none; }

  /* Bottom cards row */
  .stats-row {
    width: 100%;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 2px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 2px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.2);
  }
  .stat-label { font-size: 0.68rem; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
  .stat-value {
    font-family: 'Fredoka One', cursive; font-size: 1.5rem;
    color: var(--accent3);
    line-height: 1.1;
  }

  /* Result overlay */
  .result-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .result-overlay.show { opacity: 1; pointer-events: none; }

  .result-bubble {
    background: linear-gradient(135deg, var(--card2), var(--card));
    border: 2px solid var(--accent4);
    border-radius: 28px;
    padding: 24px 40px;
    text-align: center;
    box-shadow: 0 16px 60px rgba(0,0,0,0.6), 0 0 40px var(--glow3);
    transform: scale(0.5) translateY(40px);
    transition: transform 0.45s cubic-bezier(0.175,0.885,0.32,1.275);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .result-overlay.show .result-bubble {
    transform: scale(1) translateY(0);
  }
  .result-emoji { font-size: 2.5rem; animation: emojiSpin 0.6s ease-out; }
  @keyframes emojiSpin {
    0% { transform: rotate(-20deg) scale(0.5); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .result-label { font-size: 0.8rem; font-weight: 700; color: var(--text2); letter-spacing: 1px; }
  .result-points {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8rem; line-height: 1;
    background: linear-gradient(135deg, var(--accent2), var(--accent1));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .result-msg { font-size: 0.9rem; font-weight: 700; color: var(--text2); }

  /* Ad modal */
  .ad-modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .ad-modal.show { opacity: 1; pointer-events: all; }
  .ad-box {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px 28px 20px;
    width: min(320px, 90vw);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transform: translateY(30px) scale(0.95);
    transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  .ad-modal.show .ad-box { transform: translateY(0) scale(1); }
  .ad-box .ad-icon { font-size: 2.8rem; margin-bottom: 8px; }
  .ad-box h3 { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: var(--accent4); margin-bottom: 6px; }
  .ad-box p { font-size: 0.85rem; color: var(--text2); line-height: 1.5; margin-bottom: 16px; }
  .ad-countdown {
    font-family: 'Fredoka One', cursive; font-size: 2rem;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  .ad-progress {
    height: 5px; background: rgba(255,255,255,0.08); border-radius: 99px;
    overflow: hidden; margin-bottom: 16px;
  }
  .ad-progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent4), var(--accent1));
    border-radius: 99px; width: 0%;
    transition: width 0.1s linear;
  }
  .ad-skip-btn {
    width: 100%; padding: 13px;
    border: none; outline: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent4), var(--accent1));
    color: white; font-family: 'Fredoka One', cursive; font-size: 1.1rem;
    cursor: pointer; opacity: 0.4; transition: opacity 0.3s, transform 0.15s;
  }
  .ad-skip-btn.ready { opacity: 1; }
  .ad-skip-btn.ready:active { transform: scale(0.96); }

  /* Confetti */
  .confetti-piece {
    position: fixed; z-index: 300;
    width: 10px; height: 10px;
    border-radius: 2px;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(600px) rotate(720deg) scale(0.5); }
  }

  /* Floating +points */
  .float-point {
    position: fixed; z-index: 150;
    font-family: 'Fredoka One', cursive; font-size: 1.8rem;
    pointer-events: none;
    animation: floatUp 1.2s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-120px) scale(1.4); }
  }

  /* Wheel labels glow */
  .spinning-aura {
    position: absolute; inset: -4px; border-radius: 50%;
    border: 3px solid var(--accent1);
    opacity: 0;
    box-shadow: 0 0 30px var(--glow1), inset 0 0 30px var(--glow1);
    transition: opacity 0.3s;
    z-index: 3;
    pointer-events: none;
  }
  .spinning-aura.active { opacity: 1; animation: auraFlicker 0.5s ease-in-out infinite alternate; }
  @keyframes auraFlicker {
    0% { box-shadow: 0 0 20px var(--glow1), inset 0 0 20px var(--glow1); }
    100% { box-shadow: 0 0 50px var(--glow2), inset 0 0 30px var(--glow2); }
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg-stars" id="bgStars"></div>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<!-- Main App -->
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">🐱 KittySpin</div>
    <div class="streak-badge" id="streakBadge">🔥 <span id="streakCount">0</span> streak</div>
  </div>

  <!-- Points Card -->
  <div class="points-card">
    <div>
      <div class="points-label">Total Points</div>
      <div class="points-value" id="pointsDisplay">0</div>
    </div>
    <div class="points-icon">🏆</div>
  </div>

  <!-- Wheel -->
  <div class="wheel-container">
    <div class="wheel-wrap">
      <div class="wheel-glow"></div>
      <div class="wheel-outer-ring"></div>
      <div class="spinning-aura" id="spinAura"></div>
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
      <div class="wheel-center" id="wheelCenter">
        <!-- Inline SVG cat face for reliability -->
        <svg class="cat-img" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Body/face -->
          <ellipse cx="50" cy="55" rx="38" ry="36" fill="#FFD6C0"/>
          <!-- Ears -->
          <polygon points="18,28 8,8 32,22" fill="#FFD6C0"/>
          <polygon points="82,28 92,8 68,22" fill="#FFD6C0"/>
          <!-- Inner ears -->
          <polygon points="20,27 13,14 30,24" fill="#FFADB5"/>
          <polygon points="80,27 87,14 70,24" fill="#FFADB5"/>
          <!-- Face stripes -->
          <ellipse cx="50" cy="55" rx="38" ry="36" fill="url(#faceGrad)"/>
          <line x1="50" y1="19" x2="50" y2="28" stroke="#e8b89c" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="41" y1="21" x2="44" y2="30" stroke="#e8b89c" stroke-width="2" stroke-linecap="round"/>
          <line x1="59" y1="21" x2="56" y2="30" stroke="#e8b89c" stroke-width="2" stroke-linecap="round"/>
          <!-- Eyes -->
          <ellipse cx="35" cy="48" rx="9" ry="10" fill="white"/>
          <ellipse cx="65" cy="48" rx="9" ry="10" fill="white"/>
          <ellipse cx="35" cy="49" rx="6" ry="7" fill="#3B2750"/>
          <ellipse cx="65" cy="49" rx="6" ry="7" fill="#3B2750"/>
          <!-- Pupils shine -->
          <circle cx="33" cy="46" r="2" fill="white"/>
          <circle cx="63" cy="46" r="2" fill="white"/>
          <!-- Eye color -->
          <ellipse cx="35" cy="49" rx="3.5" ry="4.5" fill="#7de8e0"/>
          <ellipse cx="65" cy="49" rx="3.5" ry="4.5" fill="#7de8e0"/>
          <ellipse cx="35" cy="49" rx="2" ry="3" fill="#1a1535"/>
          <ellipse cx="65" cy="49" rx="2" ry="3" fill="#1a1535"/>
          <!-- Nose -->
          <polygon points="50,61 46,66 54,66" fill="#ff6bbd"/>
          <!-- Mouth -->
          <path d="M44 68 Q50 74 56 68" stroke="#d4736b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <!-- Whiskers -->
          <line x1="14" y1="64" x2="43" y2="66" stroke="#c9a090" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="14" y1="70" x2="43" y2="68" stroke="#c9a090" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="86" y1="64" x2="57" y2="66" stroke="#c9a090" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="86" y1="70" x2="57" y2="68" stroke="#c9a090" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Blush -->
          <ellipse cx="25" cy="62" rx="8" ry="5" fill="#ffb0c8" opacity="0.5"/>
          <ellipse cx="75" cy="62" rx="8" ry="5" fill="#ffb0c8" opacity="0.5"/>
          <defs>
            <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
              <stop offset="0%" stop-color="#FFE8D8"/>
              <stop offset="100%" stop-color="#FFD6C0" stop-opacity="0"/>
            </radialGradient>
          </defs>
        </svg>
      </div>
      <!-- Pointer -->
      <div class="wheel-pointer">
        <div class="pointer-body"></div>
      </div>
    </div>

    <!-- Spin Button -->
    <button class="spin-btn" id="spinBtn" onclick="initSpin()">
      <span>🎰</span> SPIN!
    </button>
  </div>

  <!-- Stats row -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Spins</div>
      <div class="stat-value" id="totalSpins">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Best Win</div>
      <div class="stat-value" id="bestWin">—</div>
    </div>
  </div>
</div>

<!-- Result overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-bubble">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-label">YOU WON</div>
    <div class="result-points" id="resultPoints">+5</div>
    <div class="result-msg" id="resultMsg">Meow-velous!</div>
  </div>
</div>

<!-- Ad Modal -->
<div class="ad-modal" id="adModal">
  <div class="ad-box">
    <div class="ad-icon">📺</div>
    <h3>Watch & Earn!</h3>
    <p>Watch a short ad to unlock your next spin and earn more points!</p>
    <div class="ad-countdown" id="adCountdown">3</div>
    <div class="ad-progress"><div class="ad-progress-fill" id="adProgressFill"></div></div>
    <button class="ad-skip-btn" id="adSkipBtn" onclick="finishAd()" disabled>
      🎯 Spin Now!
    </button>
  </div>
</div>

<script>
// ===== State =====
const state = {
  points: parseInt(localStorage.getItem('kittyPoints') || '0'),
  totalSpins: parseInt(localStorage.getItem('kittySpins') || '0'),
  bestWin: parseInt(localStorage.getItem('kittyBest') || '0'),
  streak: parseInt(localStorage.getItem('kittyStreak') || '0'),
  isSpinning: false,
  currentRotation: 0,
  adPending: false,
};

// ===== Wheel Config =====
const SEGMENTS = [
  { label: '😿 None', value: 0, color: '#3d2e5e', textColor: '#b8aedd' },
  { label: '⭐ +1',   value: 1, color: '#7de8e0', textColor: '#0f2a28' },
  { label: '🌟 +1',   value: 1, color: '#a78bfa', textColor: '#1a0f3a' },
  { label: '💫 +2',   value: 2, color: '#ff6bbd', textColor: '#3a0020' },
  { label: '✨ +5',   value: 5, color: '#ffcf40', textColor: '#2a1d00' },
  { label: '🔥 +10',  value: 10, color: '#ff8c5a', textColor: '#2a1000' },
];
const NUM_SEG = SEGMENTS.length;
const SEG_ANGLE = (2 * Math.PI) / NUM_SEG;

// ===== Weighted random =====
function getWeightedSegmentIndex() {
  // Weights: none=35, +1(1)=25, +1(2)=20, +2=12, +5=5, +10=3
  const weights = [35, 25, 20, 12, 5, 3];
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return 0;
}

// ===== Canvas Wheel =====
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const size = Math.min(300, Math.min(window.innerWidth, window.innerHeight) * 0.8);
canvas.width = size;
canvas.height = size;
const cx = size / 2, cy = size / 2, radius = size / 2 - 4;

function drawWheel(rotation = 0) {
  ctx.clearRect(0, 0, size, size);

  for (let i = 0; i < NUM_SEG; i++) {
    const startAngle = rotation + i * SEG_ANGLE - Math.PI / 2;
    const endAngle = startAngle + SEG_ANGLE;
    const seg = SEGMENTS[i];

    // Segment fill
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();

    // Segment border
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Inner arc shine
    const midAngle = startAngle + SEG_ANGLE / 2;
    const grad = ctx.createLinearGradient(
      cx + Math.cos(midAngle) * radius * 0.3,
      cy + Math.sin(midAngle) * radius * 0.3,
      cx + Math.cos(midAngle) * radius * 0.95,
      cy + Math.sin(midAngle) * radius * 0.95
    );
    grad.addColorStop(0, 'rgba(255,255,255,0.12)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(midAngle);
    ctx.textAlign = 'right';
    ctx.fillStyle = seg.textColor;
    ctx.font = `bold ${Math.floor(size * 0.068)}px Nunito, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 4;
    ctx.fillText(seg.label, radius - 14, 5);
    ctx.restore();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Center hole (for SVG cat overlay)
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = '#0f0c1a';
  ctx.fill();
  ctx.strokeStyle = 'rgba(167,139,250,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ===== UI updates =====
function updateUI() {
  document.getElementById('pointsDisplay').textContent = state.points.toLocaleString();
  document.getElementById('totalSpins').textContent = state.totalSpins;
  document.getElementById('bestWin').textContent = state.bestWin > 0 ? '+' + state.bestWin : '—';
  document.getElementById('streakCount').textContent = state.streak;
}

function saveState() {
  localStorage.setItem('kittyPoints', state.points);
  localStorage.setItem('kittySpins', state.totalSpins);
  localStorage.setItem('kittyBest', state.bestWin);
  localStorage.setItem('kittyStreak', state.streak);
}

// ===== AD Integration =====
let adCallback = null;

function showAdModal(callback) {
  adCallback = callback;
  const modal = document.getElementById('adModal');
  modal.classList.add('show');

  // Try to trigger Monetag ad
  try {
    if (typeof show_10491425 === 'function') {
      show_10491425();
    } else if (window.show_10491425) {
      window.show_10491425();
    }
  } catch (e) {
    console.log('Ad SDK not ready yet:', e);
  }

  // Countdown
  let count = 3;
  const countEl = document.getElementById('adCountdown');
  const progressEl = document.getElementById('adProgressFill');
  const skipBtn = document.getElementById('adSkipBtn');

  countEl.textContent = count;
  progressEl.style.width = '0%';
  skipBtn.disabled = true;
  skipBtn.classList.remove('ready');

  const adInterval = setInterval(() => {
    count--;
    const pct = ((3 - count) / 3) * 100;
    progressEl.style.width = pct + '%';

    if (count <= 0) {
      clearInterval(adInterval);
      countEl.textContent = '🚀';
      skipBtn.disabled = false;
      skipBtn.classList.add('ready');
    } else {
      countEl.textContent = count;
    }
  }, 1000);
}

function finishAd() {
  const modal = document.getElementById('adModal');
  if (!document.getElementById('adSkipBtn').classList.contains('ready')) return;
  modal.classList.remove('show');
  if (adCallback) {
    adCallback();
    adCallback = null;
  }
}

// ===== Spin Logic =====
function initSpin() {
  if (state.isSpinning) return;
  showAdModal(doSpin);
}

function doSpin() {
  if (state.isSpinning) return;
  state.isSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinAura').classList.add('active');

  const targetIndex = getWeightedSegmentIndex();

  // Calculate how many full rotations + final angle
  const minRotations = 5 + Math.floor(Math.random() * 4); // 5-8 full spins
  const segCenter = (targetIndex + 0.5) * SEG_ANGLE; // center of target segment
  // We want the pointer (at top = -PI/2) to land on segment center
  // Current: pointer is at top. In our drawing, segment i starts at rotation + i*SEG_ANGLE - PI/2
  // To align segment center to top: rotation + segCenter - PI/2 = -PI/2 + 2k*PI => rotation = -segCenter + 2k*PI
  const finalAngle = (minRotations * 2 * Math.PI) - segCenter;
  const startRotation = state.currentRotation;
  const totalRotation = finalAngle + (Math.ceil(startRotation / (2 * Math.PI)) * 2 * Math.PI - startRotation % (2 * Math.PI));

  const duration = 4000 + Math.random() * 1500;
  const start = performance.now();

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function animate(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOut(progress);
    const currentRot = startRotation + totalRotation * eased;

    state.currentRotation = currentRot;
    drawWheel(currentRot);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      state.currentRotation = currentRot;
      drawWheel(currentRot);
      spinComplete(targetIndex);
    }
  }

  requestAnimationFrame(animate);
  playSound('spin');
}

function spinComplete(targetIndex) {
  const seg = SEGMENTS[targetIndex];
  state.isSpinning = false;
  state.totalSpins++;
  document.getElementById('spinAura').classList.remove('active');

  if (seg.value > 0) {
    state.points += seg.value;
    state.streak++;
    if (seg.value > state.bestWin) state.bestWin = seg.value;
    showResult(seg.value, true);
    spawnConfetti(seg.value);
    spawnFloatingPoints(seg.value, seg.color);
    playSound('win');
    document.getElementById('pointsDisplay').classList.add('bump');
    setTimeout(() => document.getElementById('pointsDisplay').classList.remove('bump'), 500);
  } else {
    state.streak = 0;
    showResult(0, false);
    playSound('lose');
  }

  saveState();
  updateUI();

  setTimeout(() => {
    document.getElementById('spinBtn').disabled = false;
  }, 1500);
}

// ===== Result Display =====
const catMsgs = {
  win10: ["Purr-fect! 🎊", "Holy Whiskers!", "MEOW-STERPIECE!"],
  win5:  ["Paw-some win! 🐾", "Lucky Kitty!", "Meow-velous!"],
  win2:  ["Nice catch, kitty!", "Fur-tastic!", "You're the cat's meow!"],
  win1:  ["Keep going, kitty!", "Tiny paws, big dreams!", "Every point counts! 🐱"],
  lose:  ["No luck this time...", "Try again, meow?", "The cat demands a retry!"],
};

function showResult(points, won) {
  const overlay = document.getElementById('resultOverlay');
  const emoji = document.getElementById('resultEmoji');
  const pointsEl = document.getElementById('resultPoints');
  const msg = document.getElementById('resultMsg');

  if (won) {
    emoji.textContent = points >= 10 ? '🎊' : points >= 5 ? '⭐' : points >= 2 ? '✨' : '🌟';
    pointsEl.textContent = '+' + points;
    const msgs = points >= 10 ? catMsgs.win10 : points >= 5 ? catMsgs.win5 : points >= 2 ? catMsgs.win2 : catMsgs.win1;
    msg.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  } else {
    emoji.textContent = '😿';
    pointsEl.textContent = '+0';
    pointsEl.style.cssText = '';
    msg.textContent = catMsgs.lose[Math.floor(Math.random() * catMsgs.lose.length)];
  }

  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 1800);
}

// ===== Confetti =====
function spawnConfetti(value) {
  const count = Math.min(8 + value * 4, 40);
  const colors = ['#ff6bbd','#ffcf40','#7de8e0','#a78bfa','#ff8c5a','#6de88a'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left: ${30 + Math.random() * 40}vw;
      top: ${20 + Math.random() * 30}vh;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      width: ${6 + Math.random() * 8}px;
      height: ${6 + Math.random() * 8}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      animation-duration: ${0.8 + Math.random() * 1.2}s;
      animation-delay: ${Math.random() * 0.3}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
}

// ===== Floating Points =====
function spawnFloatingPoints(value, color) {
  const el = document.createElement('div');
  el.className = 'float-point';
  el.style.cssText = `
    left: 45vw; top: 45vh;
    color: ${color};
    text-shadow: 0 0 20px ${color};
  `;
  el.textContent = '+' + value;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}

// ===== Sound Effects =====
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function playSound(type) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'spin') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
    } else if (type === 'win') {
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.25);
        o.start(ctx.currentTime + i * 0.1);
        o.stop(ctx.currentTime + i * 0.1 + 0.3);
      });
    } else if (type === 'lose') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
    }
  } catch(e) {}
}

// ===== Background stars =====
function createStars() {
  const container = document.getElementById('bgStars');
  for (let i = 0; i < 40; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const sz = 1 + Math.random() * 2.5;
    star.style.cssText = `
      width: ${sz}px; height: ${sz}px;
      left: ${Math.random() * 100}vw;
      top: ${Math.random() * 100}vh;
      animation-duration: ${2 + Math.random() * 3}s;
      animation-delay: ${Math.random() * 3}s;
    `;
    container.appendChild(star);
  }
}

// ===== Wheel center positioning =====
function positionWheelCenter() {
  const canvasRect = canvas.getBoundingClientRect();
  const center = document.getElementById('wheelCenter');
  const hubSize = Math.floor(size * 0.24);
  center.style.width = hubSize + 'px';
  center.style.height = hubSize + 'px';
}

// ===== Init =====
window.addEventListener('load', () => {
  createStars();
  drawWheel(state.currentRotation);
  updateUI();
  positionWheelCenter();
});

window.addEventListener('resize', () => {
  positionWheelCenter();
});

// Touch feedback on wheel
canvas.addEventListener('touchstart', () => {
  if (!state.isSpinning) canvas.style.filter = 'brightness(0.9)';
});
canvas.addEventListener('touchend', () => {
  canvas.style.filter = '';
  if (!state.isSpinning) initSpin();
});
canvas.addEventListener('click', () => {
  if (!state.isSpinning) initSpin();
});
document.getElementById('wheelCenter').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!state.isSpinning) initSpin();
});
</script>
